[project]
name = "blurring"
version = "0.1.0"
description = "Street View style face and license-plate blurring system (two-stage detector + batch blurring pipeline)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python-headless>=4.9",
    "pyyaml>=6",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
onnx = ["onnx>=1.16", "onnxruntime>=1.18"]

[project.scripts]
blurring = "blurring.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blurring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
