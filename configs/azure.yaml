# Azure App Service (Free F1: 1 GB RAM, 1 GB disk, 60 CPU-min/day). Torch-free: ONNX Runtime backend.
# Keys not listed fall back to the defaults in src/blurring/config.py.
data:
  classes: [face, plate]

inference:
  score_thresh: 0.4
  nms_iou: 0.4
  box_padding: 0.15
  blur: gaussian

serving:
  backend: onnx
  onnx_model: artifacts/model.onnx
  onnx_threads: 1                          # F1 is a shared single core; more threads only add contention
  static_dir: web/dist                     # UI and API on one origin, so no CORS needed
  cors_origins: []
  max_upload_mb: 10
  max_side: 1280                           # caps CPU per request to stretch the 60 CPU-min/day quota
  jpeg_quality: 88
